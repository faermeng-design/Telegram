name: Inspect burn UI
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          set +e
          mkdir -p inspect
          OUT=inspect/part23.txt
          J=TMessagesProj/src/main/java/org/telegram
          {
            echo "== markMessageAsRead2 в ChatActivity (с окружением)"
            grep -n -B14 -A14 "markMessageAsRead2(" $J/ui/ChatActivity.java | head -n 120
            echo
            echo "== SecretMediaViewer: удаление и закрытие"
            grep -n "deleteMessages\|messagesDeleted\|destroyTime\|markMessage\|closePhoto\|onPhotoClosed\|isOnePhoto\|ttl" $J/ui/SecretMediaViewer.java | head -n 50
          } > "$OUT" 2>&1
          {
            echo
            echo "== кто отправляет messagesDeleted"
            grep -rn "postNotificationName(NotificationCenter.messagesDeleted" $J --include=*.java | head -n 30
            echo
            echo "== ChatActivity: messagesDeleted и ttl"
            grep -n "case NotificationCenter.messagesDeleted\|id == NotificationCenter.messagesDeleted\|ttl_seconds" $J/ui/ChatActivity.java | head -n 30
          } >> "$OUT" 2>&1
          true

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part23.txt
          git commit -m "inspect part23" || echo "nothing to commit"
          git push
