name: Inspect self-destruct
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          mkdir -p inspect
          OUT=inspect/part17.txt
          J=TMessagesProj/src/main/java/org/telegram
          MC=$J/messenger/MessagesController.java
          {
            echo "== markMessageContentAsRead"
            grep -n -A70 "public void markMessageContentAsRead" $MC | head -n 110
            echo
            echo "== TL_updateReadMessagesContents"
            grep -n -A30 "updateReadMessagesContents" $MC | head -n 90
            echo
            echo "== где ставится destroyTime"
            grep -rn "destroyTime = " $J --include=*.java | head -n 25
            echo
            echo "== где создаётся readMessageContents"
            grep -rn "readMessageContents" $J --include=*.java | head -n 20
          } > "$OUT" 2>&1

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part17.txt
          git commit -m "inspect part17" || echo "nothing to commit"
          git push
