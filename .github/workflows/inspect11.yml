name: Inspect settings name
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          mkdir -p inspect
          OUT=inspect/part11.txt
          S=TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          {
            echo "== имя в SettingsActivity"
            grep -n "getUserName\|UserObject\.\|formatName\|AnimatedTextView\|SimpleTextView" $S | head -n 60
            echo
            echo "== классы шапки"
            grep -n "class .*Header\|class .*Profile\|class .*Top" $S | head -n 20
          } > "$OUT" 2>&1
          bash telegyou-mod.sh > /dev/null 2>&1 || true
          {
            echo
            echo "== UserObject после мода"
            grep -n -B3 -A12 "BadgeManager" TMessagesProj/src/main/java/org/telegram/messenger/UserObject.java | head -n 80
          } >> "$OUT" 2>&1

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part11.txt
          git commit -m "inspect part11" || echo "nothing to commit"
          git push
