name: Inspect delete alert
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          set +e
          mkdir -p inspect
          OUT=inspect/part22.txt
          A=TMessagesProj/src/main/java/org/telegram/ui/Components/AlertsCreator.java
          {
            echo "== AlertsCreator 7896-8040"
            sed -n '7896,8040p' $A
          } > "$OUT" 2>&1
          {
            echo
            echo "== AlertsCreator 8040-8190"
            sed -n '8040,8190p' $A
          } >> "$OUT" 2>&1
          true

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part22.txt
          git commit -m "inspect part22" || echo "nothing to commit"
          git push
