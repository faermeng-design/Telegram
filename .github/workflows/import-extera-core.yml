name: Import exteraGram plugin core
on:
  push:
    branches: [Plugins-1]
    paths:
      - '.github/workflows/import-extera-core.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: exteraSquad/exteraGram
          path: extera
          sparse-checkout: |
            TMessagesProj/src/full/java/com/exteragram/messenger/plugins
            TMessagesProj/src/main/res/values
            TMessagesProj/src/full/res/values

      - name: Copy plugin core
        run: |
          set -e
          SRC=extera/TMessagesProj/src/full/java/com/exteragram/messenger/plugins
          DST=TMessagesProj/src/main/java/com/exteragram/messenger/plugins
          mkdir -p "$DST"
          for f in Plugin.kt PluginsController.kt PluginsConstants.kt PythonPluginsEngine.kt; do cp "$SRC/$f" "$DST/"; done
          for d in hooks models utils xposed pip updates; do
            mkdir -p "$DST/$d"
            cp -r "$SRC/$d/." "$DST/$d/"
          done
          mkdir -p licenses
          cp extera/LICENSE licenses/EXTERAGRAM_LICENSE.txt || true
          cp extera/ADDITIONAL_TERMS.md licenses/EXTERAGRAM_ADDITIONAL_TERMS.md || true

      - name: Write compatibility stubs
        run: |
          set -e
          J=TMessagesProj/src/main/java
          E=$J/com/exteragram
          mkdir -p $J/de/robv/android/xposed $E/hook $E/messenger/utils/chats $E/messenger/utils/text $E/messenger/utils/network $E/messenger/preferences/utils $E/messenger/plugins/ui/components $E/messenger/plugins/catalog $E/messenger/plugins/analyzer

          cat > $J/de/robv/android/xposed/XC_MethodHook.java <<'EOF1'
          package de.robv.android.xposed;

          import java.lang.reflect.Member;

          /** Temporary compile-time stub (not exteraGram code). */
          public abstract class XC_MethodHook {
              public final int priority;

              public XC_MethodHook() {
                  this(50);
              }

              public XC_MethodHook(int priority) {
                  this.priority = priority;
              }

              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
              }

              protected void afterHookedMethod(MethodHookParam param) throws Throwable {
              }

              public static class MethodHookParam {
                  public Member method;
                  public Object thisObject;
                  public Object[] args;
                  private Object result = null;
                  private Throwable throwable = null;
                  public boolean returnEarly = false;

                  public Object getResult() {
                      return result;
                  }

                  public void setResult(Object result) {
                      this.result = result;
                      this.throwable = null;
                      this.returnEarly = true;
                  }

                  public Throwable getThrowable() {
                      return throwable;
                  }

                  public boolean hasThrowable() {
                      return throwable != null;
                  }

                  public void setThrowable(Throwable throwable) {
                      this.throwable = throwable;
                      this.result = null;
                      this.returnEarly = true;
                  }

                  public Object getResultOrThrowable() throws Throwable {
                      if (throwable != null) {
                          throw throwable;
                      }
                      return result;
                  }
              }

              public class Unhook {
                  private final Member hookMethod;

                  public Unhook(Member hookMethod) {
                      this.hookMethod = hookMethod;
                  }

                  public Member getHookedMethod() {
                      return hookMethod;
                  }

                  public XC_MethodHook getCallback() {
                      return XC_MethodHook.this;
                  }

                  public void unhook() {
                  }
              }
          }
          EOF1

          cat > $J/de/robv/android/xposed/XC_MethodReplacement.java <<'EOF2'
          package de.robv.android.xposed;

          /** Temporary compile-time stub (not exteraGram code). */
          public abstract class XC_MethodReplacement extends XC_MethodHook {
              public XC_MethodReplacement() {
                  super();
              }

              public XC_MethodReplacement(int priority) {
                  super(priority);
              }

              @Override
              protected final void beforeHookedMethod(MethodHookParam param) throws Throwable {
                  try {
                      param.setResult(replaceHookedMethod(param));
                  } catch (Throwable t) {
                      param.setThrowable(t);
                  }
              }

              @Override
              protected final void afterHookedMethod(MethodHookParam param) throws Throwable {
              }

              protected abstract Object replaceHookedMethod(MethodHookParam param) throws Throwable;
          }
          EOF2

          cat > $J/de/robv/android/xposed/XposedBridge.java <<'EOF3'
          package de.robv.android.xposed;

          import java.lang.reflect.Constructor;
          import java.lang.reflect.Member;
          import java.lang.reflect.Method;

          /** Temporary compile-time stub (not exteraGram code). */
          public final class XposedBridge {
              private XposedBridge() {
              }

              public static void disableProfileSaver() {
              }

              public static Object invokeOriginalMethod(Member method, Object thisObject, Object[] args) throws Throwable {
                  if (method instanceof Method) {
                      ((Method) method).setAccessible(true);
                      return ((Method) method).invoke(thisObject, args);
                  }
                  if (method instanceof Constructor) {
                      ((Constructor<?>) method).setAccessible(true);
                      return ((Constructor<?>) method).newInstance(args);
                  }
                  throw new IllegalArgumentException("Unsupported member: " + method);
              }
          }
          EOF3

