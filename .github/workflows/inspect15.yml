name: Inspect own status
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          mkdir -p inspect
          OUT=inspect/part15.txt
          P=TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          {
            echo "== formatUserStatus в ProfileActivity"
            grep -n -B6 -A8 "formatUserStatus" $P | head -n 120
            echo
            echo "== R.string.Online в ui и messenger"
            grep -rn "R.string.Online)" TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java TMessagesProj/src/main/java/org/telegram/ui/Components/ChatAvatarContainer.java TMessagesProj/src/main/java/org/telegram/messenger/LocaleController.java | head -n 20
          } > "$OUT" 2>&1

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part15.txt
          git commit -m "inspect part15" || echo "nothing to commit"
          git push
