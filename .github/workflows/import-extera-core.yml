      - name: Add missing strings
        run: |
          python3 - <<'PY'
          import re, glob, pathlib
          core = pathlib.Path("TMessagesProj/src/main/java/com/exteragram/messenger/plugins")
          used = set()
          for p in core.rglob("*"):
              if p.suffix in (".kt", ".java"):
                  used |= set(re.findall(r"\bR\.string\.(\w+)", p.read_text(encoding="utf-8", errors="ignore")))
          have = set()
          for f in glob.glob("TMessagesProj/src/main/res/values/*.xml"):
              have |= set(re.findall(r'<string\s+name="([^"]+)"', open(f, encoding="utf-8", errors="ignore").read()))
          src = {}
          for f in sorted(glob.glob("extera/TMessagesProj/src/*/res/values/*.xml")):
              t = open(f, encoding="utf-8", errors="ignore").read()
              for m in re.finditer(r'<string\s+name="([^"]+)"[^>]*>.*?</string>', t, re.S):
                  src.setdefault(m.group(1), m.group(0))
          missing = sorted(n for n in used if n not in have)
          found = [n for n in missing if n in src]
          lost = [n for n in missing if n not in src]
          lines = ['<?xml version="1.0" encoding="utf-8"?>', "<resources>"] + ["    " + src[n] for n in found] + ["</resources>"]
          pathlib.Path("TMessagesProj/src/main/res/values/telegyou_plugins_strings.xml").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("used:", len(used), "added:", len(found), "not found:", lost)
          PY

      - name: Commit
