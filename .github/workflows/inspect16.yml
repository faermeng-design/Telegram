name: Inspect splash
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          mkdir -p inspect
          OUT=inspect/part16.txt
          bash telegyou-mod.sh > /dev/null 2>&1 || true
          R=TMessagesProj/src/main/res
          {
            echo "== манифест: иконки"
            grep -rn "android:icon\|android:roundIcon\|activity-alias\|android:name=\".*Icon\"" TMessagesProj_App/src/main/AndroidManifest.xml TMessagesProj/src/main/AndroidManifest.xml 2>/dev/null | head -n 50
            echo
            echo "== mipmap-anydpi-v26"
            ls $R/mipmap-anydpi-v26 2>/dev/null | head -n 60
            echo
            echo "== ic_launcher.xml"
            cat $R/mipmap-anydpi-v26/ic_launcher.xml 2>/dev/null
            echo
            echo "== стили заставки"
            grep -rn "windowSplashScreen\|Theme.TMessages.Start\|windowBackground\" *>@drawable/\(intro\|splash\)" $R/values*/styles.xml 2>/dev/null | head -n 30
            echo
            echo "== вкл. заставки в values-v31"
            ls $R | grep "values-v" | head -n 20
            grep -rn "SplashScreen" $R/values-v31 2>/dev/null | head -n 20
          } > "$OUT" 2>&1

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part16.txt
          git commit -m "inspect part16" || echo "nothing to commit"
          git push
