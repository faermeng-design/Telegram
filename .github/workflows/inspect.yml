name: Inspect code
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect part 2
        run: |
          mkdir -p inspect
          OUT=inspect/part2.txt
          : > "$OUT"
          sec() { printf '\n=================== %s\n' "$1" >> "$OUT"; }
          show() {
            sec "$1 :: $2"
            grep -n -E -m "$5" -B "$3" -A "$4" -e "$2" "$1" 2>&1 | head -n 90 >> "$OUT" || echo "(не найдено)" >> "$OUT"
          }

          sec "Результат telegyou-mod.sh"
          bash telegyou-mod.sh >> "$OUT" 2>&1 || echo "MOD SCRIPT FAILED" >> "$OUT"

          M=TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java
          SA=TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          T=TMessagesProj/src/main/java/org/telegram/ui/ActionBar/Theme.java
          C=TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java

          show "$M" "GhostMode.keepDeleted" 4 8 4
          show "$SA" "languageRow" 1 3 8
          show "$SA" "void updateRows" 1 45 1
          show "$T" "static int getColor\(" 1 35 2
          show "$C" "currentTimeString = " 2 3 3

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part2.txt
          git commit -m "inspect part2" || echo "nothing to commit"
          git push
