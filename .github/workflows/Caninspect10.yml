name: Inspect profile 2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          mkdir -p inspect
          OUT=inspect/part10.txt
          P=TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          {
            echo "== запись текста имени"
            grep -n "nameTextView.setText\|nameTextView.getText\|nameTextView.setRightDrawable\|nameTextView.setLeftDrawable" $P | head -n 30
            echo
            echo "== avatarContainer2"
            grep -n "avatarContainer2" $P | head -n 40
            echo
            echo "== после создания nameTextView"
            sed -n '5531,5600p' $P
          } > "$OUT" 2>&1
          bash telegyou-mod.sh > /dev/null 2>&1 || true
          {
            echo
            echo "== BadgeManager: hitBadge и вокруг"
            sed -n '300,400p' TMessagesProj/src/main/java/org/telegram/messenger/BadgeManager.java
            echo
            echo "== наше нажатие в ProfileActivity"
            grep -n -B2 -A24 "telegyouDown;" $P | head -n 60
          } >> "$OUT" 2>&1

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part10.txt
          git commit -m "inspect part10" || echo "nothing to commit"
          git push
