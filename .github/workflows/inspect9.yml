name: Inspect profile
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          mkdir -p inspect
          OUT=inspect/part9.txt
          P=TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          {
            echo "== nameTextView в оригинальном ProfileActivity"
            grep -n "nameTextView" $P | head -n 60
            echo
            echo "== создание nameTextView"
            grep -n -A14 "nameTextView.* = new SimpleTextView" $P | head -n 70
          } > "$OUT" 2>&1
          echo >> "$OUT"
          echo "== запуск telegyou-mod.sh (что он сообщил)" >> "$OUT"
          bash telegyou-mod.sh > inspect/mod-log.tmp 2>&1 || echo "telegyou-mod.sh завершился с ошибкой" >> "$OUT"
          head -n 120 inspect/mod-log.tmp >> "$OUT"
          rm -f inspect/mod-log.tmp
          {
            echo
            echo "== после мода: hitBadge и showInfo"
            grep -rn "hitBadge\|showInfo" TMessagesProj/src/main/java/org/telegram | head -n 20
            echo
            echo "== BadgeManager существует?"
            ls -la TMessagesProj/src/main/java/org/telegram/messenger/BadgeManager.java
          } >> "$OUT" 2>&1

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part9.txt
          git commit -m "inspect part9" || echo "nothing to commit"
          git push
