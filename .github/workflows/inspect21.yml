name: Inspect delete dialog
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          mkdir -p inspect
          OUT=inspect/part21.txt
          J=TMessagesProj/src/main/java/org/telegram
          A=$J/ui/ActionBar/AlertsCreator.java
          # на случай другого расположения
          [ -f "$A" ] || A=$(grep -rl "class AlertsCreator" $J | head -n 1)
          {
            echo "== файл: $A"
            echo "== объявления createDeleteMessagesAlert"
            grep -n "void createDeleteMessagesAlert" $A
            echo
            echo "== deleteForAll / CheckBoxCell / deleteMessages в AlertsCreator"
            grep -n "deleteForAll\|CheckBoxCell\[\]\|\.deleteMessages(" $A | head -n 70
            echo
            echo "== MessagesController.deleteMessages"
            grep -n "public .* deleteMessages(" $J/messenger/MessagesController.java
          } > "$OUT" 2>&1
          L=$(grep -n "public void deleteMessages(ArrayList<Integer> messages, ArrayList<Long> randoms, TLRPC.EncryptedChat encryptedChat, long dialogId, boolean forAll, int mode, boolean cacheOnly, long taskId, TLObject taskRequest, int taskMode, boolean scheduled, int topicId, int quickReplyShortcut" $J/messenger/MessagesController.java | head -n 1 | cut -d: -f1)
          {
            echo
            echo "== тело главной deleteMessages (строка $L)"
            [ -n "$L" ] && sed -n "${L},$((L+110))p" $J/messenger/MessagesController.java
          } >> "$OUT" 2>&1

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part21.txt
          git commit -m "inspect part21" || echo "nothing to commit"
          git push
