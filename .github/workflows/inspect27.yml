name: Inspect stories logo
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          set +e
          mkdir -p inspect
          OUT=inspect/part27.txt
          S=TMessagesProj/src/main/java/org/telegram/ui/Stories/DialogStoriesCell.java
          {
            echo "== telegramLogoView во всём файле"
            grep -n "telegramLogoView\|telegram_logo\|logoDrawable\|AppName" $S | head -n 40
            echo
            echo "== строки 315-360"
            sed -n '315,360p' $S
          } > "$OUT" 2>&1
          true

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part27.txt
          git commit -m "inspect part27" || echo "nothing to commit"
          git push
