name: Build Telegyou
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check keys
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          case "$APP_ID" in ''|*[!0-9]*) echo "::error::Секрет APP_ID пустой или в нём не только цифры"; exit 1;; esac
          if [ -z "$APP_HASH" ]; then echo "::error::Секрет APP_HASH пустой"; exit 1; fi

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          
        - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Put API keys
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          APP_ID=$(echo "$APP_ID" | tr -d '[:space:]')
          APP_HASH=$(echo "$APP_HASH" | tr -d '[:space:]')
          printf '%s = %s\n' "APP_ID" "$APP_ID" "APP_HASH" "$APP_HASH" > API_KEYS
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = $APP_ID;/" $F || true
          sed -i "s/APP_HASH = \"[0-9a-f]*\";/APP_HASH = \"$APP_HASH\";/" $F || true

      - name: Apply Telegyou mod
        run: bash telegyou-mod.sh && bash telegyou-ui.sh

      - name: Rename app to Telegyou
        run: |
          for f in $(grep -rl --include=strings.xml 'name="AppName' TMessagesProj TMessagesProj_App 2>/dev/null); do
            sed -i 's|\(<string name="AppName[A-Za-z]*"[^>]*>\)[^<]*\(</string>\)|\1Telegyou\2|' "$f"
          done

      - name: Install NDK and accept licenses
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          NDK=$(grep -E "^\s*ndkVersion" TMessagesProj/build.gradle | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" || true)
          yes | $SDKM --licenses > /dev/null || true
          if [ -n "$NDK" ]; then $SDKM "ndk;$NDK"; fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g" assembleAfatDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Telegyou-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
