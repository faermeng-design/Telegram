name: Check plugins compile
on:
  push:
    branches: [Plugins-1]
    paths:
      - '.github/workflows/check-plugins.yml'
      - 'TMessagesProj/build.gradle'
      - 'TMessagesProj_App/build.gradle'
      - 'build.gradle'
      - 'TMessagesProj/src/main/java/com/exteragram/**'
      - 'TMessagesProj/src/main/java/de/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install NDK and accept licenses
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          NDK=$(grep -E "^\s*ndkVersion" TMessagesProj/build.gradle | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" || true)
          yes | $SDKM --licenses > /dev/null || true
          if [ -n "$NDK" ]; then $SDKM "ndk;$NDK"; fi
      - name: Compile
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 --continue -Dorg.gradle.jvmargs="-Xmx4g" :TMessagesProj:compileDebugKotlin :TMessagesProj:compileDebugJavaWithJavac 2>&1 | tee gradle.log
      - name: Errors to summary
        if: always()
        run: |
          {
            echo '~~~'
            grep -E '^e: |error: |FAILED|What went wrong' gradle.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | cut -c1-260 | head -400
            echo '~~~'
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-log
          path: gradle.log
