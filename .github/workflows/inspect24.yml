name: Inspect intro
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          set +e
          mkdir -p inspect
          OUT=inspect/part24.txt
          J=TMessagesProj/src/main/java/org/telegram
          I=$J/ui/IntroActivity.java
          {
            echo "== IntroActivity: названия и картинки"
            grep -n "Page1Title\|AppName\|titles\[\|intro_tg_plane\|setTelegramTextures\|loadTexture\|R.drawable.intro" $I | head -n 60
            echo
            echo "== intro_tg_plane в ресурсах"
            ls -la TMessagesProj/src/main/res/drawable*/intro_tg_plane.* 2>&1
          } > "$OUT" 2>&1
          pip install --quiet pillow 2>/dev/null
          bash telegyou-mod.sh > inspect/modlog.tmp 2>&1
          {
            echo
            echo "== после мода: размеры intro_tg_plane"
            python3 - <<'PY'
          import glob
          from PIL import Image
          for f in sorted(glob.glob('TMessagesProj/src/main/res/drawable*/intro_tg_plane.*')):
              im = Image.open(f).convert('RGBA')
              print(f, im.size, 'content:', im.getchannel('A').getbbox())
          PY
            echo
            echo "== после мода: что в IntroActivity"
            grep -n "Telegyou\|Page1Title" $I | head -n 10
            echo
            echo "== лог скриптов про приветственный экран"
            grep -n "Приветств\|название\|Название" inspect/modlog.tmp | head -n 20
          } >> "$OUT" 2>&1
          rm -f inspect/modlog.tmp
          true

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part24.txt
          git commit -m "inspect part24" || echo "nothing to commit"
          git push
