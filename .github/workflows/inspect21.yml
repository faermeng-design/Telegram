name: Inspect delete dialog
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          set +e
          mkdir -p inspect
          OUT=inspect/part21.txt
          J=TMessagesProj/src/main/java/org/telegram
          A=$(grep -rl "class AlertsCreator" $J | head -n 1)
          MC=$J/messenger/MessagesController.java
          {
            echo "== файл: $A"
            echo
            echo "== AlertsCreator: удаление сообщений"
            grep -n "createDeleteMessagesAlert\|deleteForAll\|CheckBoxCell\[\]" "$A" | head -n 60
            echo
            echo "== AlertsCreator: вызовы deleteMessages"
            grep -n "\.deleteMessages(" "$A" | head -n 30
            echo
            echo "== MessagesController: deleteMessages"
            grep -n -A70 "public void deleteMessages(" $MC | head -n 260
          } > "$OUT" 2>&1
          true

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part21.txt
          git commit -m "inspect part21" || echo "nothing to commit"
          git push
