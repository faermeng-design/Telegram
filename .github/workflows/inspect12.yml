name: Inspect settings title
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          mkdir -p inspect
          OUT=inspect/part12.txt
          S=TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          {
            echo "== titleView"
            grep -n "titleView" $S | head -n 40
            echo
            echo "== строки 515-545"
            sed -n '515,545p' $S
          } > "$OUT" 2>&1

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add inspect/part12.txt
          git commit -m "inspect part12" || echo "nothing to commit"
          git push
